[package]
name = "sharedai-protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"
[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53.3", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "1"
