# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: nisaba
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: graphics
priority: optional
maintainer: ${WORDCRAFT_MAINTAINER}
vendor: Tom Blanchard
homepage: https://github.com/tomblanchard312/Qanloom
license: MIT OR Apache-2.0
description: |-
  Open-source, native word processor that works the way Word users expect.
  The ribbon, styles, tables, track changes, references and mail merge; reads
  and writes .docx, opens .odt, .rtf, .html, .md and .txt, and exports PDF.
  Includes nisaba-cli, a headless converter and command runner. Based on Nisaba.

# The binaries link only glibc and libgcc_s directly. Windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here
# rather than ELF NEEDED entries.
overrides:
  deb:
    depends:
      - enki-runtime (>= 0.2.0~preview.2)
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    depends:
      - libxkbcommon
      - (vulkan-loader or libglvnd-egl)
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/lib/wordcraft/
    dst: /usr/lib/wordcraft/
  - src: ${STAGE}/usr/bin/nisaba
    dst: /usr/bin/nisaba
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/nisaba-cli
    dst: /usr/bin/nisaba-cli
    file_info: { mode: 0755 }
  # The .deb uses the device's single shared Enki (the enki-runtime package,
  # /usr/lib/enki) instead of carrying its own copy. The .rpm keeps the bundled
  # installer until an enki-runtime RPM exists.
  - src: ${STAGE}/usr/bin/nisaba-install-enki
    dst: /usr/bin/nisaba-install-enki
    file_info: { mode: 0755 }
    packager: rpm
  - src: ${STAGE}/usr/lib/nisaba/
    dst: /usr/lib/nisaba/
    type: tree
    packager: rpm
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
