# Builds and tests on FreeBSD, inside a FreeBSD VM on a Linux runner.
name: FreeBSD

# The VM build is slow, so it runs nightly on the default branch and on pushes to `release`.
# PRs that change the dependency graph, application, or FreeBSD build path run it as well.
on:
  push:
    branches: [release]
  pull_request:
    paths:
      - .github/workflows/freebsd.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - rust-toolchain
      - crates/**
      - apps/**
      - packaging/llama/**
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["14", "15"]
    steps:
      - uses: actions/checkout@v7
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          cpu: 4
          usesh: true
          copyback: false
          prepare: |
            pkg install -y pkgconf alsa-lib cmake curl llvm libX11 libxkbcommon libXcursor libXi libXrender mesa-libs mesa-dri vulkan-loader crosextrafonts-carlito noto-sans-hebrew noto-sans-arabic noto-sans-thai
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            . "$HOME/.cargo/env"
            export LIBCLANG_PATH="$(ls -d /usr/local/llvm*/lib | sort -V | tail -n 1)"
            export WGPU_BACKEND=vulkan
            set -- /usr/local/share/vulkan/icd.d/lvp_icd*.json
            export VK_ICD_FILENAMES="$1"
            test -f "$VK_ICD_FILENAMES"
            sh packaging/llama/freebsd-cargo.sh test --workspace
            sh packaging/llama/freebsd-cargo.sh build --release -p wordcraft -p wordcraft-cli
            target/release/wordcraft-cli --version
